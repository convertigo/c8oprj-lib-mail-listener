↓download [steps.SimpleStep-1791380001001]: 
  comment: Fetches the message again by UID and writes each pending attachment to a temp file (upload_list).
  expression: |
    '// Downloads the attachments of a routed mail from IMAP (message found again by UID, UIDVALIDITY checked) into
    // temp files for the put loop. Attachments already stored are skipped (retry after a failure); a part bigger than
    // max_mb is not kept and is listed with skipped = "too_large". Fatal problems go to store_error.
    var imapHost = "${lib_maillistener.imap.host=imap.gmail.com}";
    var imapPort = "${lib_maillistener.imap.port=993}";
    var imapUser = "${lib_maillistener.imap.user=changeme}";
    var imapFolder = "${lib_maillistener.imap.folder=INBOX}";
    var imapPassword = String(imap_password || "");
    var maxMb = Number(max_mb);
    if (!(maxMb > 0)) {
      maxMb = 500;
    }
    var maxBytes = maxMb * 1024 * 1024;
    
    var doc = (mail_doc != null && !mail_doc.error) ? mail_doc : null;
    doc_found = doc != null;
    attachments_meta = (doc && doc.attachments) ? doc.attachments : [];
    upload_list = [];
    current_rev = doc ? String(doc._rev) : "";
    var pending = [];
    for (var p = 0; p < attachments_meta.length; p++) {
      if (attachments_meta[p].stored !== true) { pending.push(p); }
    }
    
    var store = null;
    var inbox = null;
    try {
      if (doc == null) {
        throw new Error("mail document " + docid + " not found");
      }
      if (pending.length > 0) {
        if (imapPassword == "") {
          throw new Error("IMAP password not configured: define the lib_maillistener.imap.password.secret symbol");
        }
        var props = new java.util.Properties();
        props.put("mail.store.protocol", "imaps");
        props.put("mail.imaps.host", imapHost);
        props.put("mail.imaps.port", imapPort);
        props.put("mail.imaps.ssl.enable", "true");
        props.put("mail.imaps.ssl.protocols", "TLSv1.2 TLSv1.3");
        props.put("mail.imaps.ssl.checkserveridentity", "true");
        store = javax.mail.Session.getInstance(props, null).getStore("imaps");
        store.connect(imapHost, Number(imapPort), imapUser, imapPassword);
        inbox = store.getFolder(imapFolder);
        inbox.open(javax.mail.Folder.READ_ONLY);
        if (doc.uidValidity && String(doc.uidValidity) != String(inbox.getUIDValidity())) {
          throw new Error("mailbox renumbered since the mail was stored (UIDVALIDITY changed): attachments no longer reachable");
        }
        var message = inbox.getMessageByUID(Number(doc.uid));
        if (message == null) {
          throw new Error("message UID " + doc.uid + " no longer in " + imapFolder);
        }
        // Same walk and classification as extractContent in mail_poll.fetch_mails, so indexes match the metadata
        var parts = [];
        var walk = function (part) {
          var disposition = String(part.getDisposition() || "").toLowerCase();
          var fileName = "";
          try {
            fileName = part.getFileName() ? String(javax.mail.internet.MimeUtility.decodeText(part.getFileName())) : "";
          } catch (e) {
            fileName = String(part.getFileName() || "");
          }
          if (part.isMimeType("multipart/*")) {
            var multipart = part.getContent();
            for (var k = 0; k < multipart.getCount(); k++) { walk(multipart.getBodyPart(k)); }
          } else if (disposition == "attachment" || fileName != "" || part.isMimeType("message/rfc822")) {
            parts.push(part);
          }
        };
        walk(message);
        if (parts.length != attachments_meta.length) {
          throw new Error("attachment list changed on the server (" + parts.length + " parts, " + attachments_meta.length + " expected)");
        }
        var buffer = java.lang.reflect.Array.newInstance(java.lang.Byte.TYPE, 65536);
        for (var q = 0; q < pending.length; q++) {
          var index = pending[q];
          var meta = attachments_meta[index];
          var part = parts[index];
          // getSize() is the encoded (base64) size: skip without downloading when the decoded file is surely too big
          if (Number(part.getSize()) * 0.73 > maxBytes) {
            meta.skipped = "too_large";
            continue;
          }
          var file = java.io.File.createTempFile("maillistener-", ".att");
          file.deleteOnExit();
          var input = part.getInputStream();
          var output = new java.io.FileOutputStream(file);
          var total = 0;
          var tooLarge = false;
          try {
            var read;
            while ((read = input.read(buffer)) != -1) {
              total += read;
              if (total > maxBytes) { tooLarge = true; break; }
              output.write(buffer, 0, read);
            }
          } finally {
            try { output.close(); } catch (e) {}
            try { input.close(); } catch (e) {}
          }
          if (tooLarge) {
            file["delete"]();
            meta.skipped = "too_large";
            continue;
          }
          delete meta.skipped;
          upload_list.push({
            index: index,
            storedName: (index + 1) + "-" + String(meta.name || "attachment").replace(/[^A-Za-z0-9._-]+/g, "_"),
            path: String(file.getAbsolutePath()),
            contentType: String(meta.contentType || "application/octet-stream"),
            bytes: total
          });
        }
      }
    } catch (e) {
      store_error = String(e && e.message ? e.message : e);
      for (var u = 0; u < upload_list.length; u++) {
        try { new java.io.File(upload_list[u].path)["delete"](); } catch (e2) {}
      }
      upload_list = [];
    } finally {
      try { if (inbox && inbox.isOpen()) { inbox.close(false); } } catch (e) {}
      try { if (store) { store.close(); } } catch (e) {}
    }'
