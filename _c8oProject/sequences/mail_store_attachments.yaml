↓check [steps.SimpleStep-1791380001056]: 
  comment: Fails the run on fatal problems so mail_route marks the mail as error.
  expression: |
    '// Fatal problems fail the run: mail_route then marks the mail as error and mail_replay retries it later.
    if (has_attachment_meta && !/^20[12]$/.test(String(meta_status))) {
      store_error = (store_error != "" ? store_error + " | " : "") + "metadata update failed, HTTP status " + meta_status;
    }
    if (store_error != "") {
      throw new Error(store_error);
    }'
