accessibility: Private
comment: 'Stores the attachment files of a routed mail as CouchDB attachments of mail-<uid> (name: <index>-<safe name>, original name kept in the attachments metadata). The message is fetched again from IMAP by UID (UIDVALIDITY checked) and each part goes through a temp file. Parts above lib_maillistener.attachments.max_mb (default 500) are listed as skipped (too_large). Already stored parts are skipped, so a retry resumes. Fatal problems fail the run. Called by mail_route before the business sequence.'
responseTimeout: 3600
