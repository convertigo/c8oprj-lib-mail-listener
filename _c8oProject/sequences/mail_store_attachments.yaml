  ↓after_put [steps.SimpleStep-1791380027860]: 
    comment: Deletes the temp file and records the outcome.
    expression: |
      '// The temp file is removed whatever happened; a failed upload makes the run fail (mail_replay retries it).
      try { new java.io.File(item.path)["delete"](); } catch (e) {}
      if (/^20[12]$/.test(String(put_status))) {
        current_rev = String(put_rev);
        attachments_meta[item.index].stored = true;
        attachments_meta[item.index].storedName = item.storedName;
        attachments_meta[item.index].storedBytes = item.bytes;
      } else if (store_error == "") {
        store_error = "upload of " + item.storedName + " failed, HTTP status " + put_status;
      }'
↓prepare_meta [steps.SimpleStep-1791380001030]: 
  comment: Builds the attachments metadata update and the summary.
  expression: |
    '// Records which attachments are stored; the files themselves are in the document _attachments, under storedName.
    var storedCount = 0;
    var skippedCount = 0;
    for (var m = 0; m < attachments_meta.length; m++) {
      if (attachments_meta[m].stored === true) {
        storedCount++;
      } else if (attachments_meta[m].skipped) {
        skippedCount++;
      }
    }
    attachments_status = attachments_meta.length == 0 ? "none"
      : (store_error != "" ? "error" : (storedCount == attachments_meta.length ? "stored" : "partial"));
    has_attachment_meta = doc_found && attachments_meta.length > 0;
    _id = String(docid);
    _use_json_base = JSON.stringify({ attachments: attachments_meta, attachmentsStatus: attachments_status });
    meta_status = "";
    store_summary = { docid: String(docid), attachments: attachments_meta.length, stored: storedCount, skipped: skippedCount, status: attachments_status, error: store_error != "" ? store_error : null };'
