comment: Polls the IMAP inbox for mails with uid > state.lastUid (at most max_per_poll per run) and hands the batch to mail_ingest, which stores, routes and commits the cursor. First run (or UIDVALIDITY change) starts from the current UIDNEXT. Scheduled outside the project (administration console).
