accessibility: Private
comment: 'Scheduled entry point. Takes the state-inbox lock (skips when another run is live), polls the IMAP inbox for mails with uid > lastUid (at most max_per_poll), hands the batch to mail_ingest (store, route, cursor), retries pending / error mails with mail_replay, purges mail documents older than the retention with mail_purge, then releases the lock and records lastError. First run (or UIDVALIDITY change) starts from the current UIDNEXT. Returns a run summary (key result: status ok / failed / skipped, one-line summary, mailbox cursor, counts, one line per mail read with sender, subject and outcome, replay, purge, errors) and logs the one-line summary at INFO. Scheduled outside the project (administration console).'
responseTimeout: 3600
