↓fetch_mails [steps.SimpleStep-1791302907429]: 
  comment: Connects to the IMAP mailbox, fetches mails with uid > lastUid (capped by max_per_poll), extracts sender, Authentication-Results, subject, body (text/plain, else text/html as text, capped) and attachment metadata, and exposes mails, last_uid, uid_next, uid_validity, has_more for call_ingest. Failures go to fetch_error.
  expression: |
    '// IMAP fetch (engine-embedded javax.mail). Reads the stored cursor (lastUidVar, uidValidityVar) and hands
    // mails / last_uid / uid_next / uid_validity / has_more to the call_ingest step variables.
    // First run (no cursor yet) or UIDVALIDITY change: start from now instead of replaying the mailbox history.
    // Any failure is kept in fetch_error so mail_poll releases its lock and records lastError before failing.
    var imapHost = "${lib_maillistener.imap.host=imap.gmail.com}";
    var imapPort = "${lib_maillistener.imap.port=993}";
    var imapUser = "${lib_maillistener.imap.user=changeme}";
    var imapFolder = "${lib_maillistener.imap.folder=INBOX}";
    // The password comes from the masked imap_password variable, never from this source
    var imapPassword = String(imap_password || "");
    var maxPerPoll = Math.max(1, Number(max_per_poll) || 50);
    var maxBodyChars = 200000;
    var storedLastUid = Number(typeof lastUidVar == "undefined" ? 0 : lastUidVar) || 0;
    var storedUidValidity = (typeof uidValidityVar == "undefined" || uidValidityVar == null) ? "" : String(uidValidityVar);
    
    // MIME walk: the first text/plain part is the body, text/html is the fallback (tags stripped); parts with a file
    // name, an attachment disposition or an embedded message are listed as attachments (metadata only, not stored).
    function extractContent(message, maxChars) {
      var text = null;
      var html = null;
      var attachments = [];
      var walk = function (part) {
        var disposition = String(part.getDisposition() || "").toLowerCase();
        var fileName = "";
        try {
          fileName = part.getFileName() ? String(javax.mail.internet.MimeUtility.decodeText(part.getFileName())) : "";
        } catch (e) {
          fileName = String(part.getFileName() || "");
        }
        if (part.isMimeType("multipart/*")) {
          var multipart = part.getContent();
          for (var k = 0; k < multipart.getCount(); k++) { walk(multipart.getBodyPart(k)); }
        } else if (disposition == "attachment" || fileName != "" || part.isMimeType("message/rfc822")) {
          attachments.push({
            name: fileName != "" ? fileName : "part-" + (attachments.length + 1),
            contentType: String(part.getContentType() || "").split(";")[0].trim().toLowerCase(),
            size: Number(part.getSize())
          });
        } else if (text == null && part.isMimeType("text/plain")) {
          try { text = String(part.getContent()); } catch (e) {}
        } else if (html == null && part.isMimeType("text/html")) {
          try { html = String(part.getContent()); } catch (e) {}
        }
      };
      walk(message);
      var body = "";
      if (text != null) {
        body = text;
      } else if (html != null) {
        body = html.replace(/<(script|style)[\s\S]*?<\/\1>/gi, " ")
          .replace(/<br\s*\/?>|<\/(p|div|li|tr|h[1-6])>/gi, "\n")
          .replace(/<[^>]+>/g, " ")
          .replace(/&nbsp;/gi, " ").replace(/&lt;/gi, "<").replace(/&gt;/gi, ">")
          .replace(/&quot;/gi, "\"").replace(/&#39;/g, "''").replace(/&amp;/gi, "&")
          .replace(/[ \t]+/g, " ").replace(/\s*\n\s*/g, "\n").trim();
      }
      var truncated = body.length > maxChars;
      return { body: truncated ? body.substring(0, maxChars) : body, bodyTruncated: truncated, attachments: attachments };
    }
    
    var fetched = [];
    var initialize = false;
    var moreLeft = false;
    var uidNext = 0;
    var uidValidity = "";
    var store = null;
    var inbox = null;
    fetch_error = "";
    try {
      if (imapPassword == "") {
        throw new Error("IMAP password not configured: define the lib_maillistener.imap.password.secret symbol");
      }
      var props = new java.util.Properties();
      props.put("mail.store.protocol", "imaps");
      props.put("mail.imaps.host", imapHost);
      props.put("mail.imaps.port", imapPort);
      props.put("mail.imaps.ssl.enable", "true");
      // The embedded javax.mail defaults to TLS versions the JDK disables, and does not check the server name
      props.put("mail.imaps.ssl.protocols", "TLSv1.2 TLSv1.3");
      props.put("mail.imaps.ssl.checkserveridentity", "true");
      store = javax.mail.Session.getInstance(props, null).getStore("imaps");
      store.connect(imapHost, Number(imapPort), imapUser, imapPassword);
      inbox = store.getFolder(imapFolder);
      inbox.open(javax.mail.Folder.READ_ONLY);
      uidNext = Number(inbox.getUIDNext());
      uidValidity = String(inbox.getUIDValidity());
      initialize = storedLastUid <= 0 || (storedUidValidity != "" && storedUidValidity != uidValidity);
      var fromUid = initialize ? uidNext : storedLastUid + 1;
      if (uidNext - 1 >= fromUid) {
        var msgs = inbox.getMessagesByUID(fromUid, uidNext - 1);
        for (var i = 0; i < msgs.length; i++) {
          var m = msgs[i];
          var uid = Number(inbox.getUID(m));
          if (uid < fromUid) { continue; }
          if (fetched.length >= maxPerPoll) { moreLeft = true; break; }
          // from keeps the display form for traceability; fromAddresses holds the bare addresses used by the rules
          var from = "";
          var fromAddresses = [];
          try {
            var fa = m.getFrom();
            if (fa && fa.length > 0) {
              from = String(fa[0]);
              for (var a = 0; a < fa.length; a++) {
                if (typeof fa[a].getAddress == "function") { fromAddresses.push(String(fa[a].getAddress())); }
              }
            }
          } catch (e) {}
          // Topmost Authentication-Results header only: the one added by our receiving server (checked in mail_ingest)
          var authResults = "";
          try { var arh = m.getHeader("Authentication-Results"); if (arh && arh.length > 0) { authResults = String(arh[0]); } } catch (e) {}
          var subject = "";
          try { subject = String(m.getSubject()); } catch (e) {}
          var receivedAt = "";
          try { var d = m.getReceivedDate(); if (d) { receivedAt = new Date(d.getTime()).toISOString(); } } catch (e) {}
          var content = { body: "", bodyTruncated: false, attachments: [] };
          try { content = extractContent(m, maxBodyChars); } catch (e) {}
          fetched.push({
            uid: uid,
            mailbox: imapUser,
            from: from,
            fromAddresses: fromAddresses,
            authResults: authResults,
            subject: subject,
            body: content.body,
            bodyTruncated: content.bodyTruncated,
            receivedAt: receivedAt,
            attachments: content.attachments
          });
        }
      }
    } catch (e) {
      fetch_error = String(e && e.message ? e.message : e);
    } finally {
      try { if (inbox && inbox.isOpen()) { inbox.close(false); } } catch (e) {}
      try { if (store) { store.close(); } } catch (e) {}
    }
    
    mails = JSON.stringify(fetched);
    last_uid = String(initialize ? uidNext - 1 : storedLastUid);
    uid_next = String(uidNext);
    uid_validity = uidValidity;
    has_more = String(moreLeft);'
