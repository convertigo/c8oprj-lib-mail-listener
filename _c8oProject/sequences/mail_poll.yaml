↓prepare_release [steps.SimpleStep-1791307362479]: 
  comment: Builds the lock release with the outcome of the run.
  expression: |
    '// Releases the lock and records the outcome of the run in state-inbox (lastError is empty when everything went fine).
    var runErrors = [];
    if (String(fetch_error || "") != "") { runErrors.push("fetch: " + fetch_error); }
    if (String(ingest_error || "") != "") { runErrors.push("ingest: " + ingest_error); }
    if (String(replay_error || "") != "") { runErrors.push("replay: " + replay_error); }
    if (String(purge_error || "") != "") { runErrors.push("purge: " + purge_error); }
    run_error = runErrors.join(" | ").substring(0, 2000);
    _id = "state-inbox";
    _use_json_base = JSON.stringify({ running: false, runningSince: "", lastRunAt: new Date().toISOString(), lastError: run_error });
    release_status = "";'
