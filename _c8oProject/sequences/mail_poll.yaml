↓fetch_mails [steps.SimpleStep-1791302907429]: 
  comment: Connects to the IMAP mailbox of this listener (imap_* variables, defaults = lib_maillistener.imap.* symbols), fetches mails with uid > lastUid (capped by max_per_poll), computes the mail key (Message-ID), extracts sender, recipients (to, cc, replyTo, deliveredTo), Authentication-Results, subject, dates, body (text/plain, else text/html as text, capped), writes the attachment files to temp files, and exposes mails, last_uid, uid_next, uid_validity, has_more for call_ingest. Failures go to fetch_error.
  expression: |
    '// IMAP fetch (engine-embedded javax.mail) for this listener. The mailbox settings come from the mail_poll variables
    // imap_host, imap_port, imap_user, imap_folder and imap_password, whose defaults are the lib_maillistener.imap.*
    // symbols: a Scheduler job overrides them to watch another mailbox. Reads the stored cursor (lastUidVar,
    // uidValidityVar) and hands mails / last_uid / uid_next / uid_validity / has_more to the call_ingest step variables.
    // The attachment files are written to temp files now, while the mailbox is open: mail_ingest uploads them when it
    // stores the mail for the first time, and cleanup_files deletes every temp file at the end of the run.
    // First run (no cursor yet) or UIDVALIDITY change: start from now instead of replaying the mailbox history.
    // Any failure is kept in fetch_error so mail_poll releases its lock and records lastError before failing.
    var imapHost = String(imap_host || "").trim();
    var imapPort = String(imap_port || "993").trim();
    var imapUser = String(imap_user || "").trim();
    var imapFolder = String(imap_folder || "INBOX").trim();
    // The password comes from the masked imap_password variable, never from this source
    var imapPassword = String(imap_password || "");
    var maxPerPoll = Math.max(1, Number(max_per_poll) || 50);
    var maxBodyChars = 200000;
    var maxRecipients = 100;
    var maxMb = Number(attachments_max_mb);
    if (!(maxMb > 0)) {
      maxMb = 500;
    }
    var maxBytes = maxMb * 1024 * 1024;
    var storedLastUid = Number(typeof lastUidVar == "undefined" ? 0 : lastUidVar) || 0;
    var storedUidValidity = (typeof uidValidityVar == "undefined" || uidValidityVar == null) ? "" : String(uidValidityVar);
    
    // Mail identity shared by every listener: SHA-256 of the Message-ID header, or of mailbox / folder / UIDVALIDITY /
    // UID when the mail has none. The same mail read twice, or by several listeners, maps to the same mail-<key> document.
    function mailKey(messageId, validity, uid) {
      var source = messageId != "" ? "message-id:" + messageId
        : "uid:" + imapUser.toLowerCase() + "/" + imapFolder + "/" + validity + "/" + uid;
      var digest = java.security.MessageDigest.getInstance("SHA-256").digest(new java.lang.String(source).getBytes("UTF-8"));
      var hex = "";
      for (var h = 0; h < 16; h++) {
        hex += ("0" + (digest[h] & 0xff).toString(16)).slice(-2);
      }
      return hex;
    }
    
    // Bare lowercase addresses of an address header (groups such as undisclosed-recipients are skipped), at most
    // maxRecipients of them.
    function addressList(list) {
      var out = [];
      if (list) {
        for (var r = 0; r < list.length && out.length < maxRecipients; r++) {
          var address = typeof list[r].getAddress == "function" ? String(list[r].getAddress() || "") : "";
          if (address.indexOf("@") > 0) { out.push(address.toLowerCase()); }
        }
      }
      return out;
    }
    
    // The content handlers of the embedded javax.mail can be missing for the calling thread: getContent() then returns a
    // raw stream instead of a Multipart or a String. Multipart and text parts are decoded from their data source or
    // stream in that case, so the body and the attachments never depend on them.
    function asMultipart(part) {
      var raw = part.getContent();
      if (raw instanceof javax.mail.Multipart) {
        return raw;
      }
      if (raw instanceof java.io.InputStream) { try { raw.close(); } catch (e) {} }
      return new javax.mail.internet.MimeMultipart(part.getDataHandler().getDataSource());
    }
    function asText(part) {
      var raw = part.getContent();
      if (typeof raw == "string" || raw instanceof java.lang.String) {
        return String(raw);
      }
      if (raw instanceof java.io.InputStream) { try { raw.close(); } catch (e) {} }
      var charset = "UTF-8";
      try {
        var declared = new javax.mail.internet.ContentType(part.getContentType()).getParameter("charset");
        if (declared) { charset = javax.mail.internet.MimeUtility.javaCharset(declared); }
      } catch (e) {}
      var input = part.getInputStream();
      try {
        return String(new java.lang.String(input.readAllBytes(), charset));
      } finally {
        try { input.close(); } catch (e) {}
      }
    }
    
    // MIME walk: the first text/plain part is the body, text/html is the fallback (tags stripped); parts with a file
    // name, an attachment disposition or an embedded message are attachments (metadata, and the part for saveParts).
    function extractContent(message, maxChars) {
      var text = null;
      var html = null;
      var attachments = [];
      var parts = [];
      var walk = function (part) {
        var disposition = String(part.getDisposition() || "").toLowerCase();
        var fileName = "";
        try {
          fileName = part.getFileName() ? String(javax.mail.internet.MimeUtility.decodeText(part.getFileName())) : "";
        } catch (e) {
          fileName = String(part.getFileName() || "");
        }
        if (part.isMimeType("multipart/*")) {
          var multipart = asMultipart(part);
          for (var k = 0; k < multipart.getCount(); k++) { walk(multipart.getBodyPart(k)); }
        } else if (disposition == "attachment" || fileName != "" || part.isMimeType("message/rfc822")) {
          attachments.push({
            name: fileName != "" ? fileName : "part-" + (attachments.length + 1),
            contentType: String(part.getContentType() || "").split(";")[0].trim().toLowerCase(),
            size: Number(part.getSize())
          });
          parts.push(part);
        } else if (text == null && part.isMimeType("text/plain")) {
          try { text = asText(part); } catch (e) {}
        } else if (html == null && part.isMimeType("text/html")) {
          try { html = asText(part); } catch (e) {}
        }
      };
      walk(message);
      var body = "";
      if (text != null) {
        body = text;
      } else if (html != null) {
        body = html.replace(/<(script|style)[\s\S]*?<\/\1>/gi, " ")
          .replace(/<br\s*\/?>|<\/(p|div|li|tr|h[1-6])>/gi, "\n")
          .replace(/<[^>]+>/g, " ")
          .replace(/&nbsp;/gi, " ").replace(/&lt;/gi, "<").replace(/&gt;/gi, ">")
          .replace(/&quot;/gi, "\"").replace(/&#39;/g, "''").replace(/&amp;/gi, "&")
          .replace(/[ \t]+/g, " ").replace(/\s*\n\s*/g, "\n").trim();
      }
      var truncated = body.length > maxChars;
      return { body: truncated ? body.substring(0, maxChars) : body, bodyTruncated: truncated, attachments: attachments, parts: parts };
    }
    
    // Writes each attachment part to a temp file (tempPath, bytes). A part above attachments_max_mb is not kept and is
    // listed with skipped = "too_large"; a part that cannot be read is listed with skipped = "download_failed".
    var buffer = java.lang.reflect.Array.newInstance(java.lang.Byte.TYPE, 65536);
    function saveParts(content) {
      for (var p = 0; p < content.parts.length; p++) {
        var meta = content.attachments[p];
        var file = null;
        try {
          var part = content.parts[p];
          // getSize() is the encoded (base64) size: skip without downloading when the decoded file is surely too big
          if (Number(part.getSize()) * 0.73 > maxBytes) {
            meta.skipped = "too_large";
            continue;
          }
          file = java.io.File.createTempFile("maillistener-", ".att");
          file.deleteOnExit();
          temp_files.push(String(file.getAbsolutePath()));
          var input = part.getInputStream();
          var output = new java.io.FileOutputStream(file);
          var total = 0;
          var tooLarge = false;
          try {
            var read;
            while ((read = input.read(buffer)) != -1) {
              total += read;
              if (total > maxBytes) { tooLarge = true; break; }
              output.write(buffer, 0, read);
            }
          } finally {
            try { output.close(); } catch (e) {}
            try { input.close(); } catch (e) {}
          }
          if (tooLarge) {
            file["delete"]();
            meta.skipped = "too_large";
          } else {
            meta.tempPath = String(file.getAbsolutePath());
            meta.bytes = total;
          }
        } catch (e) {
          if (file != null) { try { file["delete"](); } catch (e2) {} }
          meta.skipped = "download_failed";
        }
      }
    }
    
    var fetched = [];
    var initialize = false;
    var moreLeft = false;
    var uidNext = 0;
    var uidValidity = "";
    var store = null;
    var inbox = null;
    fetch_error = "";
    try {
      if (imapHost == "" || imapUser == "") {
        throw new Error("IMAP host or user not configured: define the lib_maillistener.imap.* symbols or set imap_host / imap_user");
      }
      if (imapPassword == "") {
        throw new Error("IMAP password not configured: define the lib_maillistener.imap.password.secret symbol or set imap_password");
      }
      var props = new java.util.Properties();
      props.put("mail.store.protocol", "imaps");
      props.put("mail.imaps.host", imapHost);
      props.put("mail.imaps.port", imapPort);
      props.put("mail.imaps.ssl.enable", "true");
      // The embedded javax.mail defaults to TLS versions the JDK disables, and does not check the server name
      props.put("mail.imaps.ssl.protocols", "TLSv1.2 TLSv1.3");
      props.put("mail.imaps.ssl.checkserveridentity", "true");
      store = javax.mail.Session.getInstance(props, null).getStore("imaps");
      store.connect(imapHost, Number(imapPort), imapUser, imapPassword);
      inbox = store.getFolder(imapFolder);
      inbox.open(javax.mail.Folder.READ_ONLY);
      uidNext = Number(inbox.getUIDNext());
      uidValidity = String(inbox.getUIDValidity());
      initialize = storedLastUid <= 0 || (storedUidValidity != "" && storedUidValidity != uidValidity);
      var fromUid = initialize ? uidNext : storedLastUid + 1;
      if (uidNext - 1 >= fromUid) {
        var msgs = inbox.getMessagesByUID(fromUid, uidNext - 1);
        for (var i = 0; i < msgs.length; i++) {
          var m = msgs[i];
          var uid = Number(inbox.getUID(m));
          if (uid < fromUid) { continue; }
          if (fetched.length >= maxPerPoll) { moreLeft = true; break; }
          // from keeps the display form for traceability; fromAddresses holds the bare addresses used by the rules
          var from = "";
          var fromAddresses = [];
          try {
            var fa = m.getFrom();
            if (fa && fa.length > 0) {
              from = String(fa[0]);
              for (var a = 0; a < fa.length; a++) {
                if (typeof fa[a].getAddress == "function") { fromAddresses.push(String(fa[a].getAddress())); }
              }
            }
          } catch (e) {}
          // Recipients: To and Cc, Reply-To (where replies go; javax.mail answers the sender when the header is absent) and
          // Delivered-To (the address the mailbox received the mail for, topmost first: it tells which alias or group got
          // it, and is the only trace of a Bcc recipient)
          var to = [];
          var cc = [];
          var replyTo = [];
          var deliveredTo = [];
          try { to = addressList(m.getRecipients(javax.mail.Message.RecipientType.TO)); } catch (e) {}
          try { cc = addressList(m.getRecipients(javax.mail.Message.RecipientType.CC)); } catch (e) {}
          try { replyTo = addressList(m.getReplyTo()); } catch (e) {}
          try {
            var dt = m.getHeader("Delivered-To");
            if (dt) {
              for (var t = 0; t < dt.length && deliveredTo.length < maxRecipients; t++) { deliveredTo.push(String(dt[t]).trim().toLowerCase()); }
            }
          } catch (e) {}
          // Topmost Authentication-Results header only: the one added by our receiving server (checked in mail_ingest)
          var authResults = "";
          try { var arh = m.getHeader("Authentication-Results"); if (arh && arh.length > 0) { authResults = String(arh[0]); } } catch (e) {}
          var messageId = "";
          try { messageId = String(m.getMessageID() || "").trim(); } catch (e) {}
          var subject = "";
          try { subject = String(m.getSubject()); } catch (e) {}
          var sentAt = "";
          try { var sd = m.getSentDate(); if (sd) { sentAt = new Date(sd.getTime()).toISOString(); } } catch (e) {}
          var receivedAt = "";
          try { var d = m.getReceivedDate(); if (d) { receivedAt = new Date(d.getTime()).toISOString(); } } catch (e) {}
          var content = { body: "", bodyTruncated: false, attachments: [], parts: [] };
          var contentError = "";
          try {
            content = extractContent(m, maxBodyChars);
          } catch (e) {
            contentError = String(e && e.message ? e.message : e);
            try { log.warn("mail_poll " + listener + ": content of UID " + uid + " could not be read: " + contentError); } catch (e2) {}
          }
          saveParts(content);
          fetched.push({
            key: mailKey(messageId, uidValidity, uid),
            messageId: messageId,
            uid: uid,
            mailbox: imapUser,
            folder: imapFolder,
            from: from,
            fromAddresses: fromAddresses,
            to: to,
            cc: cc,
            replyTo: replyTo,
            deliveredTo: deliveredTo,
            authResults: authResults,
            subject: subject,
            body: content.body,
            bodyTruncated: content.bodyTruncated,
            sentAt: sentAt,
            receivedAt: receivedAt,
            attachments: content.attachments,
            contentError: contentError
          });
        }
      }
    } catch (e) {
      fetch_error = String(e && e.message ? e.message : e);
    } finally {
      try { if (inbox && inbox.isOpen()) { inbox.close(false); } } catch (e) {}
      try { if (store) { store.close(); } } catch (e) {}
    }
    
    mails = JSON.stringify(fetched);
    last_uid = String(initialize ? uidNext - 1 : storedLastUid);
    uid_next = String(uidNext);
    uid_validity = uidValidity;
    has_more = String(moreLeft);'
