↓check_run [steps.SimpleStep-1791307362491]: 
  comment: Fails the run (visible in the Scheduler log) once the lock is released.
  expression: |
    '// Surface failures to the caller (Scheduler log) only after the lock is released.
    if (!/^20[12]$/.test(String(release_status))) {
      run_error = (run_error != "" ? run_error + " | " : "") + "lock release failed, HTTP status " + release_status;
    }
    if (run_error != "") {
      throw new Error(run_error);
    }'
