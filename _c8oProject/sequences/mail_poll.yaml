↓prepare_lock [steps.SimpleStep-1791307362423]: 
  comment: Decides whether a live run holds the lock and builds the compare-and-set lock document.
  expression: |
    '// Anti-overlap lock on state-<listener> (running + runningSince), taken with a compare-and-set write: post_document
    // with the current _rev. A concurrent run of the same listener, on this Convertigo instance or on another one, gets a
    // 409 and skips; a lock older than lock_ttl_minutes is stale and taken over.
    // A missing state document comes back as a CouchDB error object without _id.
    var state = (state_doc != null && state_doc._id) ? state_doc : {};
    var lockTtlMs = Math.max(1, Number(lock_ttl_minutes) || 15) * 60000;
    var lockedSince = Date.parse(String(state.runningSince || "")) || 0;
    lock_busy = String(state.running) == "true" && (Date.now() - lockedSince) < lockTtlMs;
    lock_holder_since = String(state.runningSince || "");
    lock_status = "";
    ingest_error = "";
    replay_error = "";
    purge_error = "";
    var lockDoc = {};
    for (var key in state) {
      if (key != "_c8oMeta" && key != "_id") { lockDoc[key] = state[key]; }
    }
    lockDoc.type = "state";
    lockDoc.listener = listener;
    lockDoc.running = true;
    lockDoc.runningSince = new Date().toISOString();
    _id = state_id;
    _use_json_base = JSON.stringify(lockDoc);'
