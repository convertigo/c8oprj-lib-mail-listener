↓build_summary [steps.SimpleStep-1791469424862]: 
  comment: Builds the run summary (status, one-line summary, mailbox cursor, counts, one line per mail read, replay, purge, errors).
  expression: |
    '// Run summary returned by mail_poll (key result); log_summary writes its one-line summary at INFO. The log line holds
    // counts and errors only: senders and subjects stay in the returned summary, out of the engine logs.
    var asList = function (v) { return v == null ? [] : (typeof v == "object" && typeof v.length == "number" ? v : [v]); };
    var num = function (v) { return Number(v) || 0; };
    var finishedMs = Date.now();
    var fetchOk = String(fetch_error || "") == "";
    var ingest = (ingest_result != null && typeof ingest_result == "object") ? ingest_result : null;
    var replay = (replay_result != null && typeof replay_result == "object") ? replay_result : null;
    var purge = (purge_result != null && typeof purge_result == "object") ? purge_result : null;
    
    var cursorBefore = num(typeof lastUidVar == "undefined" ? 0 : lastUidVar);
    var storedValidity = (typeof uidValidityVar == "undefined" || uidValidityVar == null) ? "" : String(uidValidityVar);
    var mailbox = {
      account: run_account,
      folder: run_folder,
      uidValidity: fetchOk ? String(uid_validity) : storedValidity,
      uidNext: fetchOk ? num(uid_next) : null,
      cursorBefore: cursorBefore,
      cursorAfter: ingest ? num(ingest.lastUid) : cursorBefore,
      firstRun: fetchOk && (cursorBefore <= 0 || (storedValidity != "" && storedValidity != String(uid_validity))),
      hasMore: fetchOk && String(has_more) == "true"
    };
    
    // Mails read by this run, one line each (status: routed, unmatched, error, pending, already_stored, store_error,
    // not_saved)
    var newMails = ingest ? asList(ingest.mails) : [];
    var counts = { read: newMails.length, routed: 0, unmatched: 0, error: 0, pending: 0, alreadyStored: 0, storeError: 0, notSaved: 0 };
    var statusKeys = { routed: "routed", unmatched: "unmatched", error: "error", pending: "pending", already_stored: "alreadyStored", store_error: "storeError", not_saved: "notSaved" };
    for (var i = 0; i < newMails.length; i++) {
      counts[statusKeys[String(newMails[i].status)] || "error"]++;
    }
    if (ingest == null && fetchOk) {
      // mail_ingest failed as a whole: the outcome per mail is unknown, only the number of fetched mails is reported
      try { counts.read = JSON.parse(String(mails || "[]")).length; } catch (e) {}
    }
    var replaySummary = replay == null ? null : {
      candidates: num(replay.candidates),
      retried: num(replay.retried),
      routed: num(replay.routed),
      unmatched: num(replay.unmatched),
      errors: num(replay.errors),
      skippedMaxAttempts: num(replay.skippedMaxAttempts),
      mails: asList(replay.mails)
    };
    var purgeSummary = purge == null ? null : {
      retentionDays: num(purge.retentionDays),
      cutoff: String(purge.cutoff || ""),
      expired: num(purge.expired),
      deleted: num(purge.deleted),
      failed: num(purge.failed),
      hasMore: String(purge.hasMore) == "true"
    };
    
    var errors = [];
    if (!fetchOk) { errors.push("fetch: " + fetch_error); }
    if (String(ingest_error || "") != "") { errors.push("ingest: " + ingest_error); }
    if (String(replay_error || "") != "") { errors.push("replay: " + replay_error); }
    if (String(purge_error || "") != "") { errors.push("purge: " + purge_error); }
    if (!/^20[12]$/.test(String(release_status))) { errors.push("lock release failed, HTTP status " + release_status); }
    
    // One-line summary, for example: "3 mails read (1 routed, 1 unmatched, 1 already stored); replay: 1 retried
    // (1 routed, 0 unmatched, 0 in error); purge: 4 deleted; 2.4 s"
    var parts = [];
    if (!fetchOk) {
      parts.push("mailbox not read");
    } else if (counts.read == 0) {
      parts.push("no new mail");
    } else {
      var details = [];
      var labels = [["routed", "routed"], ["unmatched", "unmatched"], ["error", "in error"], ["pending", "left pending"],
        ["alreadyStored", "already stored"], ["storeError", "rejected by the database"], ["notSaved", "not saved"]];
      for (var l = 0; l < labels.length; l++) {
        if (counts[labels[l][0]] > 0) { details.push(counts[labels[l][0]] + " " + labels[l][1]); }
      }
      parts.push(counts.read + (counts.read == 1 ? " mail read" : " mails read") + (details.length > 0 ? " (" + details.join(", ") + ")" : ""));
    }
