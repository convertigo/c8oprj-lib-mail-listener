accessibility: Private
comment: 'Scheduled entry point, one Scheduler job per listener. Takes the state-<listener> lock (skips while another run of the same listener is live, on any Convertigo instance), polls the IMAP mailbox of the listener (imap_* variables, defaults = lib_maillistener.imap.* symbols) for mails with uid > lastUid (at most max_per_poll) and writes their attachment files to temp files, hands the batch to mail_ingest (store once, claim for this listener, business sequence, cursor), retries the pending / error mails of the listener with mail_replay, purges old documents with mail_purge, deletes the temp files, then releases the lock and records lastError. First run (or UIDVALIDITY change) starts from the current UIDNEXT. Returns a run summary (key result: status ok / failed / skipped, listener, one-line summary, mailbox cursor, counts, one line per mail read, replay, purge, errors) and logs the one-line summary at INFO.'
responseTimeout: 3600
↓start_run [steps.SimpleStep-1791469424786]: 
  comment: 'Run bookkeeping and listener identity: validates listener, sets the state-<listener> id, resets the sub-sequence results and the temp file list.'
  expression: |
    '// Run bookkeeping for the summary built by build_summary (and by the skip outputs), and listener identity: the
    // state-<listener> document holds its cursor and lock, so several listeners (Scheduler jobs, possibly on several
    // Convertigo instances) share the database without sharing a cursor.
    run_started_ms = Date.now();
    listener = String(listener || "inbox").trim();
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(listener)) {
      throw new Error("listener must be 1 to 40 letters, digits, _ or -: " + listener);
    }
    run_account = String(imap_user || "");
    run_folder = String(imap_folder || "INBOX");
    state_id = "state-" + listener;
    _use_docid = state_id;
    ingest_result = null;
    replay_result = null;
    purge_result = null;
    temp_files = [];'
