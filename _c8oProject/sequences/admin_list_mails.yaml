accessibility: Private
comment: 'Admin list for the NGX admin page: one line per mail and listener (processing documents), newest first, one page at a time. Only answers a browser session logged into the Convertigo administration console as an administrator (WEB_ADMIN role), in the Studio too; any other caller gets an error structure (code 403) and nothing is read. Variables: listener (empty = all), page (from 1), page_size (25, max 100), statuses (comma-separated, empty = all, ''none'' = nothing). Returns {items: [{docid, listener, from, subject (80 chars max), receivedAt, status, route, hasAttachments, attachmentCount}], total (after the filters), page, pageSize, pageCount, first, last, all (lines of the kept listener, before the status filter), capped (true when the 10 000 documents limit was reached), listeners (every listener found), counts: {routed, unmatched, error, pending, store_error}, statusCounts: [{status, count}] (same counts, as a list)}.'
↓check_admin [steps.SimpleStep-1791385119339]: 
  comment: Is the caller logged into the administration console as an administrator?
  expression: |
    '// Private is not enough: the Studio lets anyone run Private sequences, and a server lets any console user with the
    // test platform role run them. Only a browser session logged into the administration console as an administrator
    // (WEB_ADMIN role) may list the mails.
    var Engine = com.twinsoft.convertigo.engine.Engine;
    var Role = com.twinsoft.convertigo.engine.AuthenticatedSessionManager.Role;
    var request = context.httpServletRequest;
    var httpSession = request != null ? request.getSession(false) : null;
    is_admin = httpSession != null && Engine.authenticatedSessionManager.hasRole(httpSession, Role.WEB_ADMIN);'
