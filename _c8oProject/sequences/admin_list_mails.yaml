↓shape [steps.SimpleStep-1791383579525]: 
  comment: 'Builds the list contract: listener filter, status counts, status filter, newest first, one page, subject shortened, attachment indicator.'
  expression: |
    '// Admin list contract, one line per mail and listener (processing documents; a mail document of the former
    // single-listener format counts as listener "inbox" until the purge): listener filter, status counts (on the kept
    // listener), status filter, newest first, one page.
    var STATUSES = ["routed", "unmatched", "error", "pending", "store_error"];
    var rows = mail_docs || [];
    var listenerFilter = String(listener == null ? "" : listener).trim();
    if (listenerFilter == "null") { listenerFilter = ""; }
    var rowListener = function (d) { return String(d.type) == "processing" ? String(d.listener || "") : "inbox"; };
    var listenerSet = {};
    var listeners = [];
    var docs = [];
    for (var a = 0; a < rows.length; a++) {
      var name = rowListener(rows[a]);
      if (!listenerSet[name]) { listenerSet[name] = true; listeners.push(name); }
      if (listenerFilter == "" || listenerFilter == name) { docs.push(rows[a]); }
    }
    listeners.sort();
    
    var counts = {};
    for (var s = 0; s < STATUSES.length; s++) { counts[STATUSES[s]] = 0; }
    for (var c = 0; c < docs.length; c++) {
      var st = String(docs[c].status || "");
      if (counts[st] != null) { counts[st]++; }
    }
    var statusCounts = [];
    for (var t = 0; t < STATUSES.length; t++) { statusCounts.push({ status: STATUSES[t], count: counts[STATUSES[t]] }); }
    
    // statuses: empty = all, otherwise the listed ones (''none'' matches nothing).
    var wanted = null;
    var filter = String(statuses == null ? "" : statuses).trim();
    if (filter != "" && filter != "null") {
      wanted = {};
      var parts = filter.split(",");
      for (var w = 0; w < parts.length; w++) { wanted[parts[w].trim()] = true; }
    }
    var kept = [];
    for (var k = 0; k < docs.length; k++) {
      if (wanted == null || wanted[String(docs[k].status || "")]) { kept.push(docs[k]); }
    }
    kept.sort(function (x, y) { return String(y.receivedAt || "").localeCompare(String(x.receivedAt || "")); });
    
    var size = parseInt(page_size, 10);
    if (isNaN(size) || size < 1) { size = 25; }
    if (size > 100) { size = 100; }
    var pageCount = Math.max(1, Math.ceil(kept.length / size));
    var current = parseInt(page, 10);
    if (isNaN(current) || current < 1) { current = 1; }
    if (current > pageCount) { current = pageCount; }
    var start = (current - 1) * size;
    var end = Math.min(start + size, kept.length);
    
    var items = [];
    for (var i = start; i < end; i++) {
      var d = kept[i];
      var isProcessing = String(d.type) == "processing";
      var subject = String(d.subject || "").trim();
      if (subject == "" || subject == "null") { subject = "(no subject)"; }
      var attachmentCount = isProcessing ? (Number(d.attachmentCount) || 0) : (d.attachments || []).length;
      items.push({
        docid: String(isProcessing ? d.mailId : d._id),
        listener: rowListener(d),
        from: String(d.fromAddress || d.from || ""),
        subject: subject.length > 80 ? subject.substring(0, 79) + "…" : subject,
        receivedAt: String(d.receivedAt || ""),
        status: String(d.status || ""),
        route: String(d.route || ""),
        hasAttachments: attachmentCount > 0,
        attachmentCount: attachmentCount
      });
    }
    admin_list = {
      items: items,
      total: kept.length,
      page: current,
      pageSize: size,
      pageCount: pageCount,
      first: kept.length == 0 ? 0 : start + 1,
      last: end,
      all: docs.length,
      capped: rows.length >= 10000,
      listeners: listeners,
      counts: counts,
      statusCounts: statusCounts
    };'
