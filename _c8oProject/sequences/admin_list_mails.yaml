accessibility: Private
comment: 'Admin list of the stored mails for the NGX admin page, newest first, one page at a time. Variables: page (from 1), page_size (25, max 100), statuses (comma-separated, empty = all, ''none'' = nothing). Returns {items: [{docid, from, subject (80 chars max), receivedAt, status, route, hasAttachments, attachmentCount}], total (after the filter), page, pageSize, pageCount, first, last, all (before the filter), capped (true when the 10 000 documents limit was reached), counts: {routed, unmatched, error, pending, store_error}, statusCounts: [{status, count}] (same counts, as a list)}. Private on purpose: only a session authenticated in the Convertigo administration console can call it from the app (anonymous HTTP calls are refused on a server engine; the Studio allows Private calls for development).'
