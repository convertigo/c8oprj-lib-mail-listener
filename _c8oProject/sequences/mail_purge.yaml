accessibility: Private
comment: 'Retention: deletes mail documents (any status) stored more than retention_days ago (lib_maillistener.retention_days, default 30), 200 per run. state-inbox is never touched. Called by mail_poll under its lock; callable alone in Studio.'
↓compute_cutoff [steps.SimpleStep-1791376393468]: 
  comment: Builds the cutoff date and the Mango selector for find.
  expression: |
    '// Retention: mail documents (any status) stored more than retention_days ago are deleted; state-inbox is never
    // touched. Documents written before storedAt existed fall back to receivedAt. Invalid or non-positive value: 30.
    purge_retention_days = Number(retention_days);
    if (!(purge_retention_days > 0)) {
      purge_retention_days = 30;
    }
    purge_cutoff = new Date(Date.now() - purge_retention_days * 86400000).toISOString();
    _use_selector = JSON.stringify({
      type: "mail",
      "$or": [
        { storedAt: { "$lt": purge_cutoff } },
        { storedAt: { "$exists": false }, receivedAt: { "$lt": purge_cutoff } }
      ]
    });'
