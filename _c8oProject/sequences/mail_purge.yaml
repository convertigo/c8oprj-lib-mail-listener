↓prepare_delete [steps.SimpleStep-1791376420168]: 
  comment: Builds the bulk deletion and the summary.
  expression: |
    '// Builds the bulk deletion of the expired documents (CouchDB keeps an empty tombstone per deleted document).
    var found = expired || [];
    purge_stats = { retentionDays: purge_retention_days, cutoff: purge_cutoff, expired: found.length, deleted: 0, failed: 0, hasMore: found.length >= 200, failedIds: [] };
    var deletions = [];
    for (var i = 0; i < found.length; i++) {
      deletions.push({ _id: String(found[i]._id), _rev: String(found[i]._rev), _deleted: true });
    }
    _use_json_base = JSON.stringify(deletions);
    has_expired = deletions.length > 0;'
