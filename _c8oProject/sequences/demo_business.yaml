    ↓record [steps.SimpleStep-1791381542032]: 
      comment: Records what was read (a real treatment would process the data here).
      expression: |
        '// Records what was read (a real treatment would process the data here).
        var data = read_data == null ? "" : String(read_data);
        var isText = String(item.contentType || "").indexOf("text/") == 0;
        var clean = isText ? data : data.replace(/\s+/g, "");
        var padding = (!isText && clean.charAt(clean.length - 1) == "=") ? (clean.charAt(clean.length - 2) == "=" ? 2 : 1) : 0;
        read_files.push({
          name: String(item.name),
          storedName: String(item.storedName),
          contentType: String(item.contentType),
          storedBytes: Number(item.storedBytes),
          read: !read_skipped && String(read_status) == "200",
          encoding: read_skipped ? null : (isText ? "text" : "base64"),
          dataBytes: read_skipped ? null : (isText ? data.length : Math.max(0, clean.length * 3 / 4 - padding)),
          note: read_skipped ? "larger than 5 MB: read it with _use_attpath (file) instead of in memory" : null
        });'
