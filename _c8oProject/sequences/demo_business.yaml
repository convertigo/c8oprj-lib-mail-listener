accessibility: Private
comment: 'Reference implementation of the business sequence contract, default value of the business_sequence variable of mail_poll. Input: docid (mail-<uid>) and route. Reads the mail with maillistener.get_document, checks it (missing mail, rule_domain without verified sender: error structure, so mail_route sets status error and mail_replay retries), picks an action per route (open_ticket, file_documents, log_only), reads the stored attachment files with maillistener.get_attachment (files up to 5 MB in memory), logs the action and returns a summary. Read-only, hence idempotent. Copy it into your project and replace the action by your own logic, then set business_sequence to yourProject.yourSequence.'
