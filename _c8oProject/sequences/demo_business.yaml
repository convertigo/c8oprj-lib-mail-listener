↓prepare_mail [steps.SimpleStep-1791381542004]: 
  comment: Exposes the mail fields used by the rules and the treatment (no business logic here).
  expression: |
    '// Exposes the mail fields used by the rules and the treatment (no business logic here).
    var found = (mail != null && mail._id) ? true : false;
    var asList = function (v) { return v == null ? [] : (typeof v == "object" && typeof v.length == "number" ? v : [v]); };
    mail_missing = !found;
    subject = found ? String(mail.subject || "") : "";
    body = found ? String(mail.body || "") : "";
    from_address = found ? String(mail.fromAddress || "").toLowerCase() : "";
    from_domain = from_address.substring(from_address.lastIndexOf("@") + 1);
    // Checked by mail_ingest: true only for a single sender authenticated by DMARC
    sender_verified = found && String(mail.senderVerified) == "true";
    // Recipients, bare lowercase addresses: to, cc, reply_to (where replies go), delivered_to (the address the mailbox
    // received the mail for: alias or group, the only trace of a Bcc)
    to = found ? asList(mail.to) : [];
    cc = found ? asList(mail.cc) : [];
    reply_to = found ? asList(mail.replyTo) : [];
    delivered_to = found ? asList(mail.deliveredTo) : [];
    sent_at = found ? String(mail.sentAt || "") : "";
    // Attachment files stored with the mail; attachments_status tells whether all of them are there (stored, partial...)
    files = [];
    var list = found ? asList(mail.attachments) : [];
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].stored) == "true") { files.push(list[i]); }
    }
    attachments_status = found ? String(mail.attachmentsStatus || "") : "";
    // Filled by the treatment
    read_files = [];'
