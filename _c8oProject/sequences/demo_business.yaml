accessibility: Private
comment: 'Reference implementation of the business sequence contract, default value of the business_sequence variable of mail_poll. Input: docid (mail-<key>). Steps: init, get_mail, read_mail and prepare_mail read the mail and expose its fields (subject, body, from_address, from_domain, sender_verified, files); if_mail_missing answers an error structure for a missing mail; rules is the part to customize: it sets route (empty = not handled) and action; decision returns the route to mail_route (contract, keep it); if_handled holds the treatment of a handled mail (the demo reads the stored files with maillistener.get_attachment, logs the action and returns a summary; replace it by your own work). Idempotent. Copy it into your project, change rules and if_handled, then set business_sequence to yourProject.yourSequence.'
