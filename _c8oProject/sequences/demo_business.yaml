↓rules [steps.SimpleStep-1791479214931]: 
  comment: 'CUSTOMIZE: matching rules. Sets route (empty = mail not handled) and action.'
  expression: |
    '// ==== CUSTOMIZE: matching rules =====================================================================================
    // Decide whether this business sequence handles the mail, and how. The rules are evaluated in order, the first match
    // wins. Leave route empty for a mail that is not for this sequence: it is recorded as unmatched.
    //
    // Available: subject, body, from_address, from_domain, sender_verified (sender authenticated by DMARC),
    //            to, cc, reply_to, delivered_to (lists of bare lowercase addresses; delivered_to = alias or group that
    //            received the mail), sent_at, files (stored attachment files: name, contentType, storedName,
    //            storedBytes), attachments_status, mail (the whole mail document)
    // Set:       route  = short label of the treatment, written on the mail and shown in the admin page ("" = not handled)
    //            action = what the treatment (if_handled) does with the mail
    route = "";
    action = "";
    if (subject.toUpperCase().indexOf("URGENT") >= 0) {
      // Content rule: anyone can trigger it, so it must not lead to a sensitive action
      route = "rule_urgent";
      action = "open_ticket";
    } else if (sender_verified && from_domain == "convertigo.com") {
      // Authenticated sender from a given domain (exact match)
      route = "rule_domain";
      action = "file_documents";
    }
    // Example of a rule on the recipient alias:
    // else if (delivered_to.indexOf("support@example.com") >= 0) { route = "rule_support"; action = "open_ticket"; }
    // ==== end of the rules ==============================================================================================='
