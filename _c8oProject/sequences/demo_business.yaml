↓decide [steps.SimpleStep-1791381542004]: 
  comment: Business decision per route, with the checks a real business sequence should do.
  expression: |
    '// Demo business logic following the lib_MailListener business sequence contract:
    // - read the mail document (get_mail), then act according to the route;
    // - report a business problem with an error structure (if_error): mail_route turns it into status error and
    //   mail_replay calls this sequence again later;
    // - stay idempotent (this demo only reads) and quick (it runs inside the mail_poll run).
    var found = (mail != null && mail._id) ? true : false;
    demo_error = "";
    if (!found) {
      demo_error = "mail document " + docid + " not found";
    } else if (String(route) == "rule_domain" && String(mail.senderVerified) != "true") {
      // Defense in depth: never act on a domain rule for a sender that is not authenticated
      demo_error = "rule_domain requires a verified sender";
    }
    has_demo_error = demo_error != "";
    // A real sequence would do the work here, for example open a ticket for an urgent mail
    demo_action = String(route) == "rule_urgent" ? "open_ticket" : (String(route) == "rule_domain" ? "file_documents" : "log_only");
    demo_attachments = [];
    var list = (found && mail.attachments) ? mail.attachments : [];
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].stored) == "true") { demo_attachments.push(list[i]); }
    }
    demo_summary = {
      docid: String(docid),
      route: String(route),
      action: demo_action,
      from: found ? String(mail.fromAddress || mail.from || "") : "",
      senderVerified: found && String(mail.senderVerified) == "true",
      subject: found ? String(mail.subject || "") : "",
      bodyPreview: found ? String(mail.body || "").substring(0, 200) : "",
      attachments: []
    };'
