accessibility: Private
comment: 'Routes a stored mail document to a business sequence based on rules, then writes status/route/routedAt/attempts/error back on the document. Input: docid (mail-<uid>). V1 rules: rule_urgent (subject contains URGENT, any sender), rule_domain (DMARC-authenticated sender from convertigo.com, exact domain). A matched mail first gets its attachment files stored (mail_store_attachments), then the business sequence runs. No match: unmatched (attachments not stored). Attachment or business failure: error, retried by mail_replay.'
responseTimeout: 3600
