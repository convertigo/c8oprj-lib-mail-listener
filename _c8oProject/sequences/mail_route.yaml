↓check_status [steps.SimpleStep-1791305897277]: 
  comment: Fails the run if the status was not persisted, then builds the summary.
  expression: |
    '// CouchDB reports a failed write as a normal response: fail instead of leaving the mail silently pending.
    if (!/^20[12]$/.test(String(status_save_status))) {
      throw new Error("Status update failed for " + docid + ", HTTP status " + status_save_status);
    }
    route_summary = { docid: String(docid), route: route_var, status: status_var, attempts: mail_attempts + 1, error: error_var };'
