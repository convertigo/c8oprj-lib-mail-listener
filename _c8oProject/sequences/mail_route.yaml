accessibility: Private
comment: 'Hands a stored mail to the business sequence of one listener, which decides how it is handled, then writes status/route/routedAt/attempts/error on the processing document of that listener. Input: docid (mail-<key>), procid (proc-<listener>-<key>), business_sequence (project.sequence, default lib_MailListener.demo_business). The business sequence returns a decision element: route not empty = routed with that route, empty = unmatched. While another listener is still uploading the attachment files of the mail (attachmentsStatus storing, less than one hour), the business sequence is not called and the status stays pending. Business failure (exception, XMLErrorStep, sequence not found, project not loaded, no decision element): error, retried by mail_replay.'
responseTimeout: 3600
