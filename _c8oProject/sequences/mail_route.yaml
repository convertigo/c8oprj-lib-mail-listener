↓prepare_status [steps.SimpleStep-1791305848732]: 
  comment: Turns the decision of the business sequence into the status of the processing document (routed, unmatched, error, or pending while the attachment files are being stored).
  expression: |
    '// Persists the decision of the business sequence on the processing document of this listener (merge policy).
    // decision.route not empty: routed with that route; empty: unmatched (the mail is not for this business sequence).
    // A failure (exception or XMLErrorStep), a sequence that could not be called (unknown project) or a response without
    // decision element is not absorbed: status error for mail_replay. While another listener is still storing the
    // attachment files, the business sequence is not called: status stays pending and attempts unchanged.
    var businessMessage = String(business_error_message || "");
    var businessDetails = String(business_error_details || "");
    var decision = (business_decision != null && typeof business_decision == "object") ? business_decision : null;
    mail_attempts_after = mail_attempts + 1;
    route_var = "";
    if (wait_for_files) {
      status_var = "pending";
      error_var = "attachment files of " + docid + " still being stored by another listener: retried later";
      mail_attempts_after = mail_attempts;
    } else if (businessMessage != "" || businessDetails != "") {
      status_var = "error";
      error_var = (businessMessage + (businessDetails != "" ? " | " + businessDetails : "")).substring(0, 2000);
    } else if (business_document == null) {
      status_var = "error";
      error_var = "business sequence " + __project + "." + __sequence + " could not be called (is the project loaded?)";
    } else if (decision == null) {
      status_var = "error";
      error_var = "business sequence " + __project + "." + __sequence + " returned no decision element";
    } else {
      route_var = String(decision.route == null ? "" : decision.route).trim().substring(0, 100);
      status_var = route_var != "" ? "routed" : "unmatched";
      error_var = null;
    }
    _id = String(procid);
    _use_json_base = JSON.stringify({
      status: status_var,
      route: route_var,
      routedAt: new Date().toISOString(),
      attempts: mail_attempts_after,
      error: error_var
    });
    status_save_status = "";'
