↓read_mail_fields [steps.SimpleStep-1791303057423]: 
  comment: Checks the mail and the processing document exist, decides whether to wait for attachment files still being stored, and resolves the business sequence target (project.sequence; mail_* and admin_* sequences of this library are refused).
  expression: |
    '// Checks the mail and the processing document exist, waits for attachment files still being stored by another
    // listener, and resolves the business sequence, which decides how the mail is handled.
    if (String(mail_http_status) != "200") {
      throw new Error("Mail document " + docid + " not found (HTTP " + mail_http_status + ")");
    }
    if (String(proc_http_status) != "200") {
      throw new Error("Processing document " + procid + " not found (HTTP " + proc_http_status + ")");
    }
    // Attempts so far (mail_replay retries until max_attempts); the business call fills the business_* vars
    mail_attempts = Number(typeof attempts_var == "undefined" ? 0 : attempts_var) || 0;
    business_error_message = "";
    business_error_details = "";
    business_decision = null;
    // The listener that stored the mail uploads its attachment files right after creating it (attachmentsStatus
    // storing): the business sequence is called once they are there, unless the upload looks abandoned (one hour).
    var storingSince = Date.parse(String(storing_since_var || "")) || 0;
    wait_for_files = String(attachments_status_var) == "storing" && (Date.now() - storingSince) < 60 * 60000;
    
    // Business sequence target "project.sequence" (business_sequence variable, set on mail_poll). call_business keeps
    // demo_business as design-time target; its __project / __sequence step variables redirect the call at runtime.
    // A mail_* or admin_* sequence of this library is refused: it would loop or bypass the admin check.
    var businessTarget = String(business_sequence || "lib_MailListener.demo_business").trim();
    if (!/^[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_][A-Za-z0-9_]*$/.test(businessTarget) || /^lib_MailListener\.(mail_|admin_)/.test(businessTarget)) {
      throw new Error("business_sequence must be project.sequence and must not be a mail_* or admin_* sequence of lib_MailListener: " + businessTarget);
    }
    var targetDot = businessTarget.indexOf(".");
    __project = businessTarget.substring(0, targetDot);
    __sequence = businessTarget.substring(targetDot + 1);'
