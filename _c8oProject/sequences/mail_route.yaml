↓read_mail_fields [steps.SimpleStep-1791303057423]: 
  comment: Checks the mail exists and decides the route (V1 rules). Sets route_var and status_var.
  expression: |
    '// Decides the route (V1 rules) from the fields exposed by the src_* steps. Sets route_var and status_var.
    if (String(mail_http_status) != "200") {
      throw new Error("Mail document " + docid + " not found (HTTP " + mail_http_status + ")");
    }
    var subject = String(subject_var);
    var body = String(body_var);
    // Sender identity: the bare address (never the display name) and the DMARC verdict computed by mail_ingest
    var fromAddress = (typeof from_address_var == "undefined" || from_address_var == null) ? "" : String(from_address_var).toLowerCase();
    var fromDomain = fromAddress.substring(fromAddress.lastIndexOf("@") + 1);
    var senderVerified = typeof sender_verified_var != "undefined" && String(sender_verified_var) == "true";
    // Attempts so far (mail_replay retries until max_attempts); the attachment and business calls fill the *_error vars
    mail_attempts = Number(typeof attempts_var == "undefined" ? 0 : attempts_var) || 0;
    attachments_error = "";
    business_error_message = "";
    business_error_details = "";
    var decided = "";
    // Rule 1: subject contains URGENT (content rule: any sender can trigger it)
    if (subject.toUpperCase().indexOf("URGENT") >= 0) {
      decided = "rule_urgent";
    }
    // Rule 2: authenticated sender from a given domain (example: convertigo.com), exact domain match
    else if (senderVerified && fromDomain == "convertigo.com") {
      decided = "rule_domain";
    }
    route_var = decided;
    status_var = (decided === "") ? "unmatched" : "routed";'
