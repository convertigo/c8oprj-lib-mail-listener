↓prepare_status [steps.SimpleStep-1791305848732]: 
  comment: Builds the status update for update_status (error when the business sequence failed).
  expression: |
    '// Persists the routing decision on the mail document; the merge policy keeps the stored mail fields.
    // Attachment storage failure, business sequence failure (exception or XMLErrorStep) or a business sequence that
    // could not be called (unknown project) is not absorbed: the mail becomes status error for mail_replay.
    var attachmentsError = String(attachments_error || "");
    var businessMessage = String(business_error_message || "");
    var businessDetails = String(business_error_details || "");
    var businessUnreachable = route_var != "" && attachmentsError == "" && typeof business_document != "undefined" && business_document == null;
    if (attachmentsError != "") {
      status_var = "error";
      error_var = ("attachments: " + attachmentsError).substring(0, 2000);
    } else if (businessMessage != "" || businessDetails != "") {
      status_var = "error";
      error_var = (businessMessage + (businessDetails != "" ? " | " + businessDetails : "")).substring(0, 2000);
    } else if (businessUnreachable) {
      status_var = "error";
      error_var = "business sequence " + __project + "." + __sequence + " could not be called (is the project loaded?)";
    } else {
      error_var = null;
    }
    _id = String(docid);
    _use_json_base = JSON.stringify({
      status: status_var,
      route: route_var,
      routedAt: new Date().toISOString(),
      attempts: mail_attempts + 1,
      error: error_var
    });
    status_save_status = "";'
