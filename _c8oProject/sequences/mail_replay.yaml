↓select [steps.SimpleStep-1791307190989]: 
  comment: Keeps the candidates below max_attempts.
  expression: |
    '// Retries mails left pending (interrupted run) or in error (business failure) until max_attempts is reached.
    var maxAttempts = Math.max(1, Number(max_attempts) || 3);
    var found = candidates || [];
    retry_list = [];
    replay_stats = { candidates: found.length, retried: 0, routed: 0, unmatched: 0, errors: 0, skippedMaxAttempts: 0, retriedIds: [], errorIds: [] };
    for (var c = 0; c < found.length; c++) {
      if ((Number(found[c].attempts) || 0) < maxAttempts) {
        retry_list.push(String(found[c]._id));
      } else {
        replay_stats.skippedMaxAttempts++;
      }
    }'
