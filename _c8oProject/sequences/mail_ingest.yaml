↓check_state [steps.SimpleStep-1791305848681]: 
  comment: Fails the run if the cursor was not persisted, then builds the summary.
  expression: |
    '// CouchDB reports a failed write as a normal response: fail the run instead of silently keeping a stale cursor.
    if (!/^20[12]$/.test(String(state_save_status))) {
      throw new Error("state-inbox update failed, HTTP status " + state_save_status);
    }
    ingest_summary = {
      lastUid: cursor_uid,
      hasMore: String(has_more) == "true",
      fetched: ingest_stats.fetched,
      saved: ingest_stats.saved,
      duplicates: ingest_stats.duplicates,
      failed: ingest_stats.failed,
      savedIds: ingest_stats.savedIds,
      failedIds: ingest_stats.failedIds
    };'
