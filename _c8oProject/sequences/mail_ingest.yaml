↓compute_state [steps.SimpleStep-1791305813299]: 
  comment: Finalises the cursor and builds the state-inbox update.
  expression: |
    '// Nothing left on the server and no failure: jump to uid_next - 1 so UID gaps are not fetched again.
    // The running flag (anti-overlap lock) belongs to mail_poll and is not touched here.
    if (!cursor_blocked && String(has_more) != "true" && Number(uid_next) > 0) {
      cursor_uid = Math.max(cursor_uid, Number(uid_next) - 1);
    }
    _id = "state-inbox";
    _use_json_base = JSON.stringify({
      type: "state",
      lastUid: cursor_uid,
      uidValidity: uid_validity == null ? "" : String(uid_validity),
      lastPollAt: new Date().toISOString()
    });
    state_save_status = "";'
