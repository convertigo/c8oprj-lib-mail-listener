  ↓track [steps.SimpleStep-1791305848638]: 
    comment: Counts the outcome of the mail document, prepares the upload and the claim, and adds the mail to the run summary.
    expression: |
      '// Outcome of the mail document: 201/202 created by this read, 409 already in the database (stored by a previous run
      // or by another listener), rejected but traced as store_error. Anything else (database down...) blocks the cursor.
      var saveCode = String(save_status);
      var stubCode = String(stub_status || "");
      mail_created = saveCode == "201" || saveCode == "202";
      mail_traced = !mail_created && saveCode != "409" && (stubCode == "201" || stubCode == "202");
      mail_exists = mail_created || saveCode == "409" || mail_traced;
      if (mail_created) {
        ingest_stats.stored++;
      } else if (saveCode == "409") {
        ingest_stats.alreadyStored++;
      } else if (mail_traced) {
        ingest_stats.storeErrors++;
      } else {
        ingest_stats.failed++;
        cursor_blocked = true;
      }
      // The upload loop reuses item: keep the mail for the next steps
      mail_item = item;
      docid = mail_docid;
      procid = "proc-" + listener + "-" + mail_key;
      upload_needed = mail_created && upload_list.length > 0;
      current_rev = String(save_rev || "");
      upload_error = "";
      
      // One line per mail for the run summary (sender, shortened subject, never the body); track_claim and track_route
      // complete it.
      var summarySubject = String(item.subject == null ? "" : item.subject).replace(/\s+/g, " ").trim();
      mail_entry = {
        uid: Number(item.uid),
        docid: docid,
        procid: procid,
        receivedAt: String(item.receivedAt || ""),
        from: mail_from != "" ? mail_from : String(item.from || ""),
        senderVerified: mail_sender_verified,
        subject: summarySubject.length > 80 ? summarySubject.substring(0, 79) + "…" : summarySubject,
        attachments: mail_attachments.length,
        stored: mail_created,
        status: mail_traced ? "store_error" : (mail_exists ? "pending" : "not_saved"),
        route: "",
        error: mail_traced ? "full document rejected by the database (HTTP " + saveCode + ")"
          : (mail_exists ? null : "not saved (HTTP " + saveCode + "), read again by the next poll")
      };
      ingest_stats.mails.push(mail_entry);'
