accessibility: Private
comment: Stores a batch of fetched mails as mail-<uid> documents (409 = already stored; rejected document = minimal store_error trace), routes each new one through mail_route, then commits the state-inbox cursor. The cursor only advances over mails that are stored or traced. Called by mail_poll under its lock; callable alone in Studio with a synthetic batch.
responseTimeout: 3600
↓prepare [steps.SimpleStep-1791305813287]: 
  comment: Parses the batch and initialises the cursor bookkeeping.
  expression: |
    '// Parses the batch handed over by mail_poll (UID order matters for the cursor) and initialises the bookkeeping.
    mail_list = JSON.parse(String(mails || "[]"));
    mail_list.sort(function (a, b) { return a.uid - b.uid; });
    cursor_uid = Number(last_uid) || 0;
    cursor_blocked = false;
    ingest_stats = { fetched: mail_list.length, saved: 0, duplicates: 0, storeErrors: 0, failed: 0, savedIds: [], storeErrorIds: [], failedIds: [], mails: [] };'
