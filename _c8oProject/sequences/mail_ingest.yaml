  ↓track [steps.SimpleStep-1791305848638]: 
    comment: Counts the outcome, advances the cursor while every mail so far is stored or traced, decides whether to route, and adds the mail to the run summary.
    expression: |
      '// Advances the cursor only while every mail so far is stored: 201/202 created, 409 already stored by a previous
      // poll, or rejected but traced as store_error. Anything else (database down...) blocks the cursor for a retry.
      var saveCode = String(save_status);
      var stubCode = String(stub_status || "");
      var created = saveCode == "201" || saveCode == "202";
      var outcome = "";
      if (created) {
        ingest_stats.saved++;
        ingest_stats.savedIds.push(_id);
        outcome = "pending";
      } else if (saveCode == "409") {
        ingest_stats.duplicates++;
        outcome = "already_stored";
      } else if (stubCode == "201" || stubCode == "202") {
        ingest_stats.storeErrors++;
        ingest_stats.storeErrorIds.push(_id);
        outcome = "store_error";
      } else {
        ingest_stats.failed++;
        ingest_stats.failedIds.push(_id);
        cursor_blocked = true;
        outcome = "not_saved";
      }
      if (!cursor_blocked) {
        cursor_uid = Math.max(cursor_uid, Number(item.uid));
      }
      docid = _id;
      route_needed = created;
      
      // One line per mail for the run summary (sender, shortened subject, never the body); track_route completes it
      // with the routing outcome of a new mail.
      var summarySubject = String(item.subject == null ? "" : item.subject).replace(/\s+/g, " ").trim();
      var summaryFrom = item.fromAddresses || [];
      mail_entry = {
        uid: Number(item.uid),
        docid: _id,
        receivedAt: String(item.receivedAt || ""),
        from: summaryFrom.length == 1 ? String(summaryFrom[0]).toLowerCase() : String(item.from || ""),
        senderVerified: null,
        subject: summarySubject.length > 80 ? summarySubject.substring(0, 79) + "…" : summarySubject,
        attachments: (item.attachments || []).length,
        status: outcome,
        route: "",
        error: outcome == "store_error" ? "full document rejected by the database (HTTP " + saveCode + ")"
          : outcome == "not_saved" ? "not saved (HTTP " + saveCode + "), fetched again by the next poll" : null
      };
      ingest_stats.mails.push(mail_entry);'
