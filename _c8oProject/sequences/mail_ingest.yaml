accessibility: Private
comment: Stores a batch of fetched mails as mail-<uid> documents (409 = already stored), routes each new one through mail_route, then commits the state-inbox cursor. The cursor only advances over mails that are actually stored. Called by mail_poll; callable alone in Studio with a synthetic batch.
↓prepare [steps.SimpleStep-1791305813287]: 
  comment: Parses the batch and initialises the cursor bookkeeping.
  expression: |
    '// Parses the batch handed over by mail_poll (UID order matters for the cursor) and initialises the bookkeeping.
    mail_list = JSON.parse(String(mails || "[]"));
    mail_list.sort(function (a, b) { return a.uid - b.uid; });
    cursor_uid = Number(last_uid) || 0;
    cursor_blocked = false;
    ingest_stats = { fetched: mail_list.length, saved: 0, duplicates: 0, failed: 0, savedIds: [], failedIds: [] };'
↓foreach_mail [steps.SimpleIteratorStep-1791305813289]: 
  comment: Iterates over the batch (item = current mail).
  expression: mail_list
  ↓prepare_save [steps.SimpleStep-1791305813291]: 
    comment: Builds the mail-<uid> document for save_mail.
    expression: |
      '// Builds the mail-<uid> document; the save_mail step variables pick _id and _use_json_base from this scope.
      _id = "mail-" + item.uid;
      _use_json_base = JSON.stringify({
        type: "mail",
        uid: item.uid,
        mailbox: item.mailbox,
        from: item.from,
        subject: item.subject,
        body: item.body,
        receivedAt: item.receivedAt,
        attachments: item.attachments,
        status: "pending",
        route: "",
        routedAt: "",
        error: null
      });
      save_status = "";'
  ↓save_mail [steps.TransactionStep-1791305813293]: 
    comment: 'Creates mail-<uid> with status=pending (policy none: an existing document answers 409).'
    sourceTransaction: lib_MailListener.maillistener.post_document
