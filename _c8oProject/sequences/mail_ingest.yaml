    ↓_use_json_base [variables.StepVariable-1791305813297]: 
      description: From the JavaScript scope (prepare_save)
  ↓read_save_status [steps.SimpleSourceStep-1791305848603]: 
    comment: HTTP status of the save (201 created, 409 already stored).
    sourceDefinition: 
      - xmlizable: 
        - ↑classname: com.twinsoft.convertigo.beans.common.XMLVector
        - com.twinsoft.convertigo.beans.common.XMLVector: 
          - java.lang.String: 
            - ↑value: 1791305813293
          - java.lang.String: 
            - ↑value: ./document/couchdb_output/_c8oMeta/statusCode/text()
    variableName: save_status
  ↓track [steps.SimpleStep-1791305848638]: 
    comment: Counts the outcome, advances the cursor while every mail so far is stored, decides whether to route.
    expression: |
      '// Advances the cursor only while every mail so far is stored (201/202 created, 409 already stored by a previous poll).
      var saveCode = String(save_status);
      if (saveCode == "201" || saveCode == "202") {
        ingest_stats.saved++;
        ingest_stats.savedIds.push(_id);
      } else if (saveCode == "409") {
        ingest_stats.duplicates++;
      } else {
        ingest_stats.failed++;
        ingest_stats.failedIds.push(_id);
        cursor_blocked = true;
      }
      if (!cursor_blocked) {
        cursor_uid = Math.max(cursor_uid, Number(item.uid));
      }
      docid = _id;
      route_needed = saveCode == "201" || saveCode == "202";'
  ↓if_new_mail [steps.IfStep-1791305848658]: 
    comment: Only a mail stored by this poll is routed; a 409 means it was already handled.
    condition: route_needed
    ↓call_route [steps.SequenceStep-1791305848663]: 
      comment: Routes the new mail.
      sourceSequence: lib_MailListener.mail_route
      ↓docid [variables.StepVariable-1791305848665]: 
        description: From the JavaScript scope (track)
↓compute_state [steps.SimpleStep-1791305813299]: 
  comment: Finalises the cursor and builds the state-inbox update.
  expression: |
    '// Nothing left on the server and no failure: jump to uid_next - 1 so UID gaps are not fetched again.
    if (!cursor_blocked && String(has_more) != "true" && Number(uid_next) > 0) {
      cursor_uid = Math.max(cursor_uid, Number(uid_next) - 1);
    }
    _id = "state-inbox";
    _use_json_base = JSON.stringify({
      type: "state",
      lastUid: cursor_uid,
      uidValidity: uid_validity == null ? "" : String(uid_validity),
      lastPollAt: new Date().toISOString(),
      running: false
    });
    state_save_status = "";'
