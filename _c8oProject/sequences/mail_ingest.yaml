    comment: Verifies the sender and builds the shared mail-<key> document and the list of files to upload.
    expression: |
      '// Sender authenticity: trust only the topmost Authentication-Results header written by our own receiving server
      // (authserv-id) and require DMARC pass for the domain of a single From address.
      var authServId = "${lib_maillistener.imap.authserv_id=mx.google.com}".toLowerCase();
      var fromAddresses = item.fromAddresses || [];
      var fromAddress = fromAddresses.length == 1 ? String(fromAddresses[0]).toLowerCase() : "";
      var fromDomain = fromAddress.substring(fromAddress.lastIndexOf("@") + 1);
      var authResults = String(item.authResults || "").replace(/\s+/g, " ");
      var senderVerified = false;
      if (fromAddress != "" && authServId != "" && authResults.split(";")[0].trim().toLowerCase() == authServId) {
        var dmarc = /\bdmarc=pass\b[^;]*\bheader\.from=([^\s;]+)/i.exec(authResults);
        senderVerified = dmarc != null && dmarc[1].toLowerCase() == fromDomain;
      }
      
      // Attachment metadata (never the temp path) and the files downloaded by fetch_mails, uploaded by if_upload only when
      // this read creates the document (attachmentsStatus storing meanwhile, so that other listeners wait for the files).
      var source = item.attachments || [];
      mail_attachments = [];
      upload_list = [];
      for (var a = 0; a < source.length; a++) {
        var meta = { name: String(source[a].name || ""), contentType: String(source[a].contentType || ""), size: Number(source[a].size) || 0, stored: false };
        if (source[a].skipped) { meta.skipped = String(source[a].skipped); }
        mail_attachments.push(meta);
        if (source[a].tempPath) {
          upload_list.push({
            index: a,
            path: String(source[a].tempPath),
            bytes: Number(source[a].bytes) || 0,
            storedName: (a + 1) + "-" + String(source[a].name || "attachment").replace(/[^A-Za-z0-9._-]+/g, "_"),
            contentType: String(source[a].contentType || "application/octet-stream")
          });
        }
      }
      mail_key = String(item.key);
      mail_docid = "mail-" + mail_key;
      mail_from = fromAddress;
      mail_sender_verified = senderVerified;
      
      // The mail-<key> document is shared by every listener (store once: policy none, an existing document answers 409);
      // the save_mail step variables pick _id and _use_json_base from this scope. The processing of the mail (status,
      // route...) is kept per listener in proc-<listener>-<key>. Recipients are bare lowercase addresses; deliveredTo tells
      // which address (alias, group) the mailbox received the mail for. contentError: why the body / attachments could not
      // be read.
      var now = new Date().toISOString();
      _id = mail_docid;
      _use_json_base = JSON.stringify({
        type: "mail",
        messageId: String(item.messageId || ""),
        mailbox: item.mailbox,
        folder: String(item.folder || ""),
        uid: item.uid,
        uidValidity: uid_validity == null ? "" : String(uid_validity),
        storedBy: listener,
        from: item.from,
        fromAddress: fromAddress,
        senderVerified: senderVerified,
        to: item.to || [],
        cc: item.cc || [],
        replyTo: item.replyTo || [],
        deliveredTo: item.deliveredTo || [],
        authResults: authResults,
        subject: item.subject,
        body: item.body,
        bodyTruncated: item.bodyTruncated === true,
        contentError: item.contentError ? String(item.contentError) : null,
        sentAt: String(item.sentAt || ""),
        receivedAt: item.receivedAt,
        storedAt: now,
        attachments: mail_attachments,
        attachmentsStatus: upload_list.length > 0 ? "storing" : (mail_attachments.length > 0 ? "partial" : "none"),
        storingSince: upload_list.length > 0 ? now : ""
      });
      save_status = "";
      save_rev = "";
      stub_status = "";
      claim_status = "";
      meta_status = "";'
