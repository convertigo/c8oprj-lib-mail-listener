accessibility: Private
comment: Stores a batch of fetched mails for one listener. Each mail is stored once in the database as mail-<key>, shared by every listener (409 = already stored by a previous run or by another listener; rejected document = minimal store_error trace), with its attachment files when this read creates it. It is then claimed for this listener (proc-<listener>-<key>, 409 = already processed by this listener) and each newly claimed mail goes to mail_route. Finally the state-<listener> cursor is committed; it only advances over mails stored (or traced) and claimed. Called by mail_poll under its lock; callable alone in Studio with a synthetic batch.
responseTimeout: 3600
