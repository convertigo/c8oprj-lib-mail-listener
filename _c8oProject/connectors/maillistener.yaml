↓find_expired [transactions.couchdb.PostFindTransaction]: 
  comment: 'Mango query for mail_purge: mail documents older than the retention (selector built by mail_purge and passed in _use_selector). The default selector matches nothing.'
  p_fields: '["_id", "_rev"]'
  p_limit: 200
  p_selector: '({ type: "mail", storedAt: { "$lt": "" } })'
  ↓_use_selector [variables.RequestableVariable-1791376317043]: 
    description: Mango selector (JSON) built by mail_purge
↓find_retry_candidates [transactions.couchdb.PostFindTransaction]: 
  comment: 'Mango query: mails left pending (interrupted run) or in error (business sequence failure), for mail_replay.'
  p_fields: '["_id", "status", "attempts"]'
  p_limit: 50
  p_selector: '({ type: "mail", status: { "$in": ["pending", "error"] } })'
