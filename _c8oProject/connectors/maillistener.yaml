↓update_document [transactions.couchdb.PostDocumentTransaction]: 
  comment: Updates an existing document by merging the posted fields (state-inbox cursor, mail status, attachment metadata). The attachments array is replaced, not merged (p_merge). CouchDB attachments (_attachments) are kept. post_document keeps policy none so creating an existing mail-<uid> stays a 409 (dedup).
  p_merge: '{"attachments":"override"}'
  policy: merge
