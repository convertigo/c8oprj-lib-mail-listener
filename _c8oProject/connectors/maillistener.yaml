  comment: Updates an existing document by merging the posted fields (state-<listener> cursor, processing status, attachment metadata). The attachments array is replaced, not merged (p_merge). CouchDB attachments (_attachments) are kept. post_document keeps policy none so creating an existing document stays a 409 (store once, claim once).
  p_merge: '{"attachments":"override"}'
  policy: merge
