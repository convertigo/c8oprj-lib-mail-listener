↓delete_documents [transactions.couchdb.PostBulkDocumentsTransaction]: 
  comment: 'Bulk write used by mail_purge to delete documents: _use_json_base is an array of {_id, _rev, _deleted: true}.'
  ↓_use_json_base [variables.RequestableVariable-1791376317139]: 
    description: 'JSON array of {_id, _rev, _deleted: true}'
↓find_expired [transactions.couchdb.PostFindTransaction]: 
  comment: 'Mango query for mail_purge: mail and processing documents older than the retention (selector built by mail_purge and passed in _use_selector). The default selector matches nothing.'
  p_fields: '["_id", "_rev"]'
  p_limit: 200
  p_selector: '({ type: { "$in": ["mail", "processing"] }, storedAt: { "$lt": "" } })'
  ↓_use_selector [variables.RequestableVariable-1791376317043]: 
    description: Mango selector (JSON) built by mail_purge
↓find_mails [transactions.couchdb.PostFindTransaction]: 
  comment: 'Mango query for the admin list: every processing document (one per mail and listener), plus the mail documents of the former single-listener format that still carry a status (until the purge). 10 000 at most; sorting, filtering and paging are done by admin_list_mails.'
  p_fields: '["_id", "type", "listener", "mailId", "from", "fromAddress", "subject", "receivedAt", "status", "route", "attachments", "attachmentCount"]'
  p_limit: 10000
  p_selector: '({ "$or": [ { type: "processing" }, { type: "mail", status: { "$exists": true } } ] })'
↓find_retry_candidates [transactions.couchdb.PostFindTransaction]: 
  comment: 'Mango query for mail_replay: processing documents of one listener left pending (interrupted run, attachment files still being stored) or in error (business sequence failure). The selector (with the listener) is built by mail_replay and passed in _use_selector.'
  p_fields: '["_id", "mailId", "status", "attempts"]'
  p_limit: 50
  p_selector: '({ type: "processing", listener: "", status: { "$in": ["pending", "error"] } })'
  ↓_use_selector [variables.RequestableVariable-1791477255596]: 
    description: Mango selector (JSON) built by mail_replay
