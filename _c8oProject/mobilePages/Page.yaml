↓MailStyle [ngx.components.UIStyle-1791383718667]: 
  comment: Compact, card-style layout of the admin mail list
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.mail-page {
            --mail-border: var(--ion-color-step-150, rgba(127, 127, 127, 0.22));
            --mail-muted: var(--ion-color-step-550, #6b7280);
            --mail-surface: var(--ion-item-background, var(--ion-background-color, #fff));
            --mail-hover: rgba(var(--ion-color-primary-rgb, 56, 128, 255), 0.05);
            font-size: 13px;
          }
          .mail-progress {
            position: sticky;
            top: 0;
            z-index: 2;
            height: 2px;
            margin-bottom: -2px;
            border-radius: 2px;
          }
          .mail-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
          }
          .mail-count {
            margin: 0;
            font-size: 12px;
            color: var(--mail-muted);
            font-variant-numeric: tabular-nums;
          }
          .mail-toolbar ion-button {
            --padding-start: 8px;
            --padding-end: 8px;
            font-size: 12px;
            text-transform: none;
            letter-spacing: 0;
            margin: 0;
          }
          .mail-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
          }
          .mail-filter {
            --size: 14px;
            --checkbox-background: transparent;
            font-size: 12px;
            padding: 5px 10px;
            border: 1px solid var(--mail-border);
            border-radius: 999px;
            background: var(--mail-surface);
            transition: border-color 0.15s, background 0.15s;
          }
          .mail-filter:hover {
            background: var(--mail-hover);
          }
          .mail-filter.checkbox-checked {
            border-color: var(--ion-color-base, var(--mail-border));
            background: rgba(var(--ion-color-base-rgb, 127, 127, 127), 0.08);
          }
          .mail-filter-count {
            margin-left: 6px;
            padding: 0 6px;
            border-radius: 999px;
            background: rgba(127, 127, 127, 0.14);
            color: var(--mail-muted);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
          }
          .mail-list {
            border: 1px solid var(--mail-border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--mail-surface);
          }
          .mail-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 9px 14px;
            border-bottom: 1px solid var(--mail-border);
            transition: background 0.12s;
          }
          .mail-row:last-child {
            border-bottom: none;
          }
          .mail-row:hover {
            background: var(--mail-hover);
          }
          .mail-main {
            flex: 1;
            min-width: 0;
          }
          .mail-subject {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            color: var(--ion-text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          .mail-from {
            margin-top: 2px;
            font-size: 12px;
            color: var(--mail-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          .mail-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
          }
          .mail-date {
            font-size: 11.5px;
            color: var(--mail-muted);
            font-variant-numeric: tabular-nums;
          }
          .mail-tags {
            display: flex;
            align-items: center;
            gap: 8px;
          }
          .mail-pill {
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.02em;
            color: var(--mail-muted);
            background: rgba(127, 127, 127, 0.14);
          }
          .pill-routed {
            color: var(--ion-color-success-shade, #2dd36f);
            background: rgba(var(--ion-color-success-rgb, 45, 211, 111), 0.14);
          }
          .pill-pending {
            color: var(--ion-color-warning-shade, #e0ac08);
            background: rgba(var(--ion-color-warning-rgb, 255, 196, 9), 0.18);
          }
          .pill-error,
          .pill-store_error {
            color: var(--ion-color-danger, #eb445a);
            background: rgba(var(--ion-color-danger-rgb, 235, 68, 90), 0.12);
          }
          .mail-route {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            color: var(--mail-muted);
          }
          .mail-attach {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 11.5px;
            color: var(--mail-muted);
          }
          .mail-attach ion-icon {
            font-size: 14px;
          }
          .mail-pager {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--mail-muted);
            font-variant-numeric: tabular-nums;
          }
          .mail-pager-nav {
            display: flex;
            align-items: center;
            gap: 2px;
          }
          .mail-pager-nav ion-button {
            margin: 0;
            --padding-start: 6px;
            --padding-end: 6px;
          }
          .mail-page-num {
            min-width: 56px;
            text-align: center;
          }
          .mail-error {
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--ion-color-danger, #eb445a);
            background: rgba(var(--ion-color-danger-rgb, 235, 68, 90), 0.08);
          }
          .mail-empty {
            padding: 32px 0;
            text-align: center;
            font-size: 13px;
            color: var(--mail-muted);
          }
          .mail-note {
            margin-top: 8px;
            font-size: 12px;
            color: var(--mail-muted);
          }
          @media (max-width: 600px) {
            .mail-row {
              flex-direction: column;
              align-items: stretch;
              gap: 6px;
            }
            .mail-side {
              flex-direction: row;
              align-items: center;
              justify-content: space-between;
            }
          }
          '